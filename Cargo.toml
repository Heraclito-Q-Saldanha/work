[package]
name = "cargo-wk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
lol_html = "3.0.1"
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "parsing", "visit", "visit-mut"] }
tempfile = "3.27.0"
toml = "1.1.7"
walkdir = "2.5.0"
wasm-bindgen-cli-support = "=0.2.129"
